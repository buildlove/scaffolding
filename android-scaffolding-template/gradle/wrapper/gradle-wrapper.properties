# ============================================================
# Gradle Wrapper 配置
# 说明：
#   - 锁定 Gradle 9.6.0（AGP 9.5.x 要求 Gradle 9.6+），clone 后无需本机安装 Gradle
#   - 默认使用华为云镜像（国内下载快，实测 Java 客户端可正常下载）；
#     海外网络可换回官方地址：
#     https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
#   - distributionSha256Sum 为 Gradle 官方校验值，用于校验镜像文件完整性
# ============================================================
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-9.6.0-bin.zip
distributionSha256Sum=bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01
# 下载超时 60 秒，避免慢网络下读取超时
networkTimeout=60000
# 弱网重试 3 次，失败后指数退避 500ms
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
