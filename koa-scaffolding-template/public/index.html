<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koa 脚手架模板</title>
  <style>
    /* ===== 家族同款浅色主题（与 vue3-scaffolding-template 首页保持一致） ===== */
    :root {
      --app-bg: #f5f7fb;
      --app-text: #303133;
      --app-text-secondary: #909399;
      --app-card-bg: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--app-bg);
      color: var(--app-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .page-body {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 欢迎横幅：家族同款渐变 */
    .hero {
      padding: 36px 40px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 55%, #06b6d4 100%);
      box-shadow: 0 12px 32px rgba(79, 70, 229, 0.25);
      color: #fff;
    }

    .hero h1 { margin: 0 0 12px; font-size: 26px; }
    .hero p { margin: 0; color: rgba(255, 255, 255, 0.85); line-height: 1.7; }

    /* 入口卡片网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      padding: 24px;
      border-radius: 12px;
      background: var(--app-card-bg);
      box-shadow: 0 4px 16px rgba(30, 41, 59, 0.06);
      text-decoration: none;
      color: var(--app-text);
      transition: transform 0.2s;
    }

    .card:hover { transform: translateY(-4px); }
    .card h2 { margin: 0 0 8px; font-size: 17px; color: #4f46e5; }
    .card p { margin: 0; font-size: 13px; color: var(--app-text-secondary); line-height: 1.7; }
  </style>
</head>
<body>
  <main class="page-body">
    <!-- 欢迎横幅 -->
    <section class="hero">
      <h1>👋 Node.js + Koa 脚手架模板</h1>
      <p>
        开箱即用的 Koa 3 后端起步工程：洋葱模型中间件、分层架构、Swagger 在线文档、
        统一响应 / 错误处理、请求日志、跨域与静态资源。
      </p>
    </section>

    <!-- 常用入口 -->
    <section class="grid">
      <a class="card" href="/api/docs">
        <h2>📄 Swagger 文档</h2>
        <p>在线可视化接口文档，支持在线调试（/api/docs）</p>
      </a>
      <a class="card" href="/api/health">
        <h2>💚 健康检查</h2>
        <p>服务探活接口（/api/health）</p>
      </a>
      <a class="card" href="/api/demo">
        <h2>🧪 演示接口</h2>
        <p>内存数据 CRUD 演示列表（/api/demo）</p>
      </a>
      <a class="card" href="/api/swagger.json">
        <h2>📦 OpenAPI JSON</h2>
        <p>原始接口描述，可导入 Apifox / Postman</p>
      </a>
    </section>
  </main>
</body>
</html>
