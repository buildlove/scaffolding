# pnpm 12 的配置迁移到本文件（package.json 的 pnpm 字段与 .npmrc 自定义配置已不再读取）
# nodeLinker=hoisted：固定扁平化 node_modules（兼容若依工程中 npm 风格的隐式依赖解析，
# 与 uniapp / RN 模板踩坑同款处理）
nodeLinker: hoisted

# pnpm 12 默认禁止依赖执行安装脚本，此处放行构建所需的二进制安装脚本：
# - esbuild：Vite 构建所需的平台二进制
# - @parcel/watcher：Vite 开发服务文件监听的原生依赖
# - vue-demi：Pinia 依赖，安装时切换 Vue2/Vue3 代码
allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  vue-demi: true
